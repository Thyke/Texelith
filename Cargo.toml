[workspace]
members = ["crates/texelith-core", "crates/texelith-gpu", "crates/texelith-io", "crates/texelith-ui-egui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "x11", "wayland"] }
rfd = "=0.18.0"
egui = "=0.37.0"
egui-wgpu = "=0.37.0"
wgpu = "=30.0.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "hdr"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
blake3 = "=1.8.7"
crossbeam-channel = "=0.5.17"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"

exr = { version = "=1.74.3", default-features = false }
gltf = { version = "=1.4.1", default-features = false, features = ["utils"] }
tobj = { version = "=4.0.5", default-features = false }
fluent-bundle = "=0.16.0"
unic-langid = "=0.9.6"
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
